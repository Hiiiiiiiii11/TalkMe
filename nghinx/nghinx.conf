events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tối ưu hóa log và timeout
    sendfile        on;
    keepalive_timeout  65;

    # ==============================================================
    # 1. HTTP REDIRECT (Chuyển toàn bộ HTTP sang HTTPS)
    # ==============================================================
    server {
        listen 80;
        listen [::]:80;
        # Liệt kê tất cả domain
        server_name fastchat1005.xyz chat.fastchat1005.xyz notification.fastchat1005.xyz user.fastchat1005.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================================================
    # 2. MAIN DOMAIN (SWAGGER UI TỔNG HỢP)
    # ==============================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name fastchat1005.xyz; # Domain gốc

        # Đường dẫn Cert (Lưu ý: Trên server phải có file này)
        ssl_certificate /etc/letsencrypt/live/fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/fastchat1005.xyz/privkey.pem;
        
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Trỏ vào container Swagger UI
        location / {
            proxy_pass http://swagger-ui:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==============================================================
    # 3. CHAT API
    # ==============================================================
    server {
        listen 443 ssl http2;
        server_name chat.fastchat1005.xyz;

        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # gRPC Routing
        location /grpcservice.ConversationGrpcService {
            grpc_pass grpcs://chatapi:443;
        }
        location /grpcservice.MessageGrpcService {
            grpc_pass grpcs://chatapi:443;
        }

        # HTTP API Routing
        location / {
            proxy_pass http://chatapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ==============================================================
    # 4. NOTIFICATION API
    # ==============================================================
    server {
        listen 443 ssl http2;
        server_name notification.fastchat1005.xyz;

        # Dùng chung cert của Chat (nếu là wildcard hoặc san) hoặc cert riêng
        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /grpcservice.NotificationGrpcService {
            grpc_pass grpcs://notificationapi:443;
        }

        location / {
            proxy_pass http://notificationapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==============================================================
    # 5. USER API
    # ==============================================================
    server {
        listen 443 ssl http2;
        server_name user.fastchat1005.xyz;

        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /grpcservice.UserGrpcService {
            grpc_pass grpcs://userapi:443;
        }

        location / {
            proxy_pass http://userapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}