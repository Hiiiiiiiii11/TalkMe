services:
  # ===================== NGINX Reverse Proxy =====================
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro 
      - ./www:/var/www/certbot:ro
    depends_on:
      - chatapi
      - notificationapi
      - userapi
    networks:
      - backend

  # ===================== Chat API =====================
  chatapi:
    build:
      context: .
      dockerfile: UserChatAPI/Dockerfile
    container_name: chatapi
    restart: always
    env_file:             # <--- QUAN TRỌNG: Load file .env
      - .env
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  # ===================== Notification API =====================
  notificationapi:
    build:
      context: .
      dockerfile: NotificationApi/Dockerfile
    container_name: notificationapi
    restart: always
    env_file:             # <--- QUAN TRỌNG: Load file .env
      - .env
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  # ===================== User API =====================
  userapi:
    build:
      context: .
      dockerfile: ChatAppAPI/Dockerfile
    container_name: userapi
    restart: always
    env_file:             # <--- QUAN TRỌNG: Load file .env
      - .env
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  # ===================== SQL Server =====================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: always
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${SA_PASSWORD} # <--- Lấy từ biến SA_PASSWORD trong file .env
      MSSQL_PID: 'Developer'
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - backend
   
  # ===================== Certbot =====================
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot

networks:
  backend:
    driver: bridge

volumes:
  sql_data: