services:
  # ===================== NGINX =====================
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot
    depends_on:
      - chatapi
      - notificationapi
      - userapi
      - swagger-ui # <--- Thêm dependency này
    networks:
      - backend

  # ===================== SWAGGER UI (MỚI) =====================
  apigateway:
    build:
      context: .
      dockerfile: APIGateway/Dockerfile
    container_name: apigateway
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - backend

  # ... (Các service ChatAPI, UserAPI, NotificationAPI, DB, Certbot giữ nguyên như cũ) ...
  # ... (Copy y nguyên phần còn lại của file bạn gửi) ...
  chatapi:
    build:
      context: .
      dockerfile: UserChatAPI/Dockerfile
    container_name: chatapi
    restart: always
    env_file:
      - .env
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  notificationapi:
    build:
      context: .
      dockerfile: NotificationApi/Dockerfile
    container_name: notificationapi
    restart: always
    env_file:
      - .env
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  userapi:
    build:
      context: .
      dockerfile: ChatAppAPI/Dockerfile
    container_name: userapi
    restart: always
    env_file:
      - .env
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: always
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: 'Developer'
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - backend
   
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot

networks:
  backend:
    driver: bridge

volumes:
  sql_data: