# =================================================================
# === CHATAPP MANAGEMENT - FINAL PRODUCTION DOCKER COMPOSE ===
# =================================================================

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./www:/var/www/certbot:ro
    depends_on:
      - chatapi
      - notificationapi
      - userapi
    networks:
      - backend

  chatapi:
    build:
      context: .
      dockerfile: UserChatAPI/Dockerfile
    container_name: chatapi
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kestrel__CertificatePassword=1234
      - "ConnectionStrings__ChatDbConnection=Server=db;Database=ChatDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;Encrypt=False;"
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  notificationapi:
    build:
      context: .
      dockerfile: NotificationApi/Dockerfile
    container_name: notificationapi
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kestrel__CertificatePassword=1234
      - "ConnectionStrings__NotificationDbConnection=Server=db;Database=NotificationDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;Encrypt=False;"
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  userapi:
    build:
      context: .
      dockerfile: ChatAppAPI/Dockerfile
    container_name: userapi
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Kestrel__CertificatePassword=1234
      - "ConnectionStrings__UserDbConnection=Server=db;Database=UserDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;Encrypt=False;"
    volumes:
      - ./certs/local:/https/certs:ro
    depends_on:
      - db
    networks:
      - backend

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: always
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'Your_strong_password123'
      MSSQL_PID: 'Developer'
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - backend

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot

networks:
  backend:
    driver: bridge

volumes:
  sql_data:

