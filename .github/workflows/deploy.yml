# Tên của workflow, sẽ hiển thị trong tab "Actions" trên GitHub
name: Deploy to EC2

# Điều kiện kích hoạt workflow: chạy khi có push lên nhánh 'main'
on:
  push:
    branches:
      - main

# Các công việc (jobs) sẽ được thực hiện
jobs:
  deploy:
    # Tên của job
    name: Deploy
    # Chạy trên một máy ảo Ubuntu mới nhất do GitHub cung cấp
    runs-on: ubuntu-latest

    # Các bước thực hiện
    steps:
      # Bước 1: Lấy mã nguồn từ repository về máy ảo runner
      - name: Checkout code
        uses: actions/checkout@v3

      # Bước 2 (MỚI): Đồng bộ file từ runner sang EC2
      #         Cách này thay thế cho 'git pull' và hoạt động với repo private
      - name: Sync repository files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./" # Sao chép toàn bộ thư mục hiện tại
          target: "~/ChatAppAPI" # Đến thư mục dự án trên EC2

      # Bước 3 (SỬA LẠI): Thực thi các lệnh trên server EC2 của bạn qua SSH
      - name: Run deployment commands on EC2
        uses: appleboy/ssh-action@master
        with:
          # Các thông tin bí mật để kết nối SSH
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Script để chạy trên server EC2
          script: |
            # Đi vào thư mục dự án
            cd ~/ChatAppAPI
            
            # ĐÃ BỎ LỆNH 'git pull' GÂY LỖI
            
            # Dừng và xóa các container cũ để chuẩn bị cho bản build mới
            echo "🛑 Stopping and removing old containers..."
            docker-compose down
            
            # Build lại và khởi động các container Docker
            echo "🚀 Building and restarting Docker containers..."
            docker-compose up --build -d
            
            # Dọn dẹp toàn bộ hệ thống Docker (container, network, image cũ) để tiết kiệm dung lượng
            echo "🧹 Pruning Docker system..."
            docker system prune -af
            
            echo "✅ Deployment successful!"