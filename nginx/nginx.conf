events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # 1. Chuyển hướng HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name fastchat1005.xyz chat.fastchat1005.xyz notification.fastchat1005.xyz user.fastchat1005.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. MAIN DOMAIN (SWAGGER UI)
    server {
        listen 443 ssl http2;
        server_name fastchat1005.xyz;

        # QUAN TRỌNG: Sửa đường dẫn về 'chat.fastchat1005.xyz'
        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://apigateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. CHAT API
    server {
        listen 443 ssl http2;
        server_name chat.fastchat1005.xyz;

        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /grpcservice.ConversationGrpcService {
            grpc_pass grpcs://chatapi:443;
        }
        location /grpcservice.MessageGrpcService {
            grpc_pass grpcs://chatapi:443;
        }

        location / {
            proxy_pass http://chatapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 4. NOTIFICATION API
    server {
        listen 443 ssl http2;
        server_name notification.fastchat1005.xyz;

        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /grpcservice.NotificationGrpcService {
            grpc_pass grpcs://notificationapi:443;
        }

        location / {
            proxy_pass http://notificationapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 5. USER API
    server {
        listen 443 ssl http2;
        server_name user.fastchat1005.xyz;

        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location /grpcservice.UserGrpcService {
            grpc_pass grpcs://userapi:443;
        }

        location / {
            proxy_pass http://userapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 5. SOCIAL API
    server {
        listen 443 ssl http2;
        server_name social.fastchat1005.xyz;

        ssl_certificate /etc/letsencrypt/live/chat.fastchat1005.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.fastchat1005.xyz/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://socialapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}